name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: clearance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clearance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_ENV: development
      DATABASE_URL: postgresql://clearance_app:ci-only-ephemeral-password@127.0.0.1:5432/clearance
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Create unprivileged test database owner
        env:
          PGPASSWORD: ci-only-ephemeral-password
        run: |
          psql -h 127.0.0.1 -U postgres -d clearance -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clearance_app LOGIN PASSWORD 'ci-only-ephemeral-password' NOSUPERUSER NOCREATEROLE NOBYPASSRLS CREATEDB;
          ALTER DATABASE clearance OWNER TO clearance_app;
          SQL
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
      - run: uv run pytest
