services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: clearance
      POSTGRES_USER: clearance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:55463:5432"
    volumes:
      - clearance_postgres:/var/lib/postgresql
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearance -d clearance"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  clearance_postgres:
