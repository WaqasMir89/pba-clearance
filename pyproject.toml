[project]
name = "pba-clearance"
version = "0.1.0"
description = "Policy-gated clearance and agency relationship platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "dj-database-url>=3,<4",
  "drf-spectacular>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "gunicorn>=23,<24",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".vcs", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
